<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who Keeps Glory?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{color-scheme:dark;--bg:#07070b;--ink:#eceef6;--soft:#8c90a3;--line:rgba(236,238,246,.14);--panel:rgba(7,7,11,.78);--accent:#3dfcff}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow:hidden;cursor:none}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px max(4vw,18px);pointer-events:none;z-index:3}
.crumb{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font:400 15px Inter,sans-serif;color:var(--soft)}
.crumb button{font:inherit;color:inherit;background:none;border:0;padding:6px 2px;cursor:pointer;min-height:44px}
.crumb button:hover,.crumb button:focus-visible{color:var(--ink);outline:none;text-decoration:underline;text-underline-offset:4px}
.crumb .here{color:var(--ink)}
.title{font:400 clamp(26px,3vw,36px)/1.05 "Instrument Serif",serif;margin:0}
#intro{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at center,rgba(7,7,11,.35),rgba(7,7,11,.85) 70%);transition:opacity 1.2s ease,visibility 1.2s;cursor:auto}
#intro.gone{opacity:0;visibility:hidden}
.card{text-align:center;max-width:560px;animation:rise 1.6s cubic-bezier(.16,1,.3,1) both}
.card h2{font:400 clamp(44px,7vw,76px)/1 "Instrument Serif",serif;margin:0 0 14px;text-shadow:0 0 40px rgba(61,252,255,.25)}
.card .lede{color:var(--soft);margin:0 0 36px;font-size:16px}
.guide{list-style:none;margin:0 auto 40px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:460px}
.guide li{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border:1px solid var(--line);border-radius:16px;background:rgba(236,238,246,.03);font-size:14px;color:var(--ink)}
.guide .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 12px currentColor;background:currentColor}
.go{min-height:52px;padding:0 34px;border-radius:999px;border:1px solid #3dfcff;background:rgba(61,252,255,.12);color:var(--ink);font:500 16px Inter,sans-serif;cursor:pointer;box-shadow:0 0 28px rgba(61,252,255,.35);transition:box-shadow .5s,background .5s;animation:pulse 2.8s ease-in-out infinite}
.go:hover,.go:focus-visible{background:rgba(61,252,255,.22);box-shadow:0 0 44px rgba(61,252,255,.6);outline:none}
.esc{margin:18px 0 0;font-size:13px;color:var(--soft)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{box-shadow:0 0 40px rgba(61,252,255,.55)}}
body.intro header,body.intro .modes{opacity:0;pointer-events:none}
header,.modes{transition:opacity 1.2s ease}
@media(prefers-reduced-motion:reduce){.card,.go{animation:none}}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);padding:96px 36px 40px;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-left:1px solid var(--line);transform:translateX(104%);transition:transform 1.4s cubic-bezier(.16,1,.3,1);overflow-y:auto;z-index:2;cursor:auto}
#panel.open{transform:none}
#panel h2{font:400 clamp(32px,4vw,46px)/1.05 "Instrument Serif",serif;margin:0 0 6px;text-wrap:balance;color:var(--hue,var(--ink));text-shadow:0 0 24px color-mix(in srgb,var(--hue,#fff) 45%,transparent)}
#panel .who{font-size:15px;color:var(--soft);margin:0 0 28px}
#panel .who b{color:var(--ink);font-weight:500}
#panel ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
#panel li button{all:unset;display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;cursor:pointer;transition:background .5s}
#panel li button::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--hue);box-shadow:0 0 10px var(--hue)}
#panel li button:hover,#panel li button:focus-visible{background:color-mix(in srgb,var(--hue) 16%,transparent)}
#panel li .q{font:italic 400 19px/1.3 "Instrument Serif",serif}
#panel p.note{font-size:16px;margin:28px 0 0}
#panel .close{position:absolute;top:28px;right:24px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:20px;cursor:pointer}
#panel .close:focus-visible,#panel li button:focus-visible,.enter:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.enter{margin-top:28px;display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--hue);background:color-mix(in srgb,var(--hue) 14%,transparent);color:var(--ink);font:500 15px Inter,sans-serif;cursor:pointer;box-shadow:0 0 18px color-mix(in srgb,var(--hue) 35%,transparent)}
.modes{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(7,7,11,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:3;transition:opacity .6s}
.modes button{min-height:40px;padding:0 18px;border:0;border-radius:999px;background:none;color:var(--soft);font:500 14px Inter,sans-serif;cursor:pointer;transition:background .5s,color .5s}
.modes button[aria-checked=true]{background:rgba(236,238,246,.12);color:var(--ink)}
.modes button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
body.reading .modes{opacity:0;pointer-events:none}
@media(max-width:600px){
  #panel{top:auto;width:100%;height:62vh;padding:64px 22px 28px;border-left:0;border-top:1px solid var(--line);border-radius:24px 24px 0 0;transform:translateY(104%)}
  .guide{grid-template-columns:minmax(0,1fr)}.guide li{flex-direction:row;justify-content:center}
}
@media (hover:none){body{cursor:auto}}
</style>
</head>
<body class="intro">
<div id="intro">
  <div class="card">
    <h2>Who Keeps Glory?</h2>
    <ul class="guide">
      <li><span class="dot" style="color:#3dfcff"></span>Move to navigate through</li>
      <li><span class="dot" style="color:#ff3df0"></span>Drag to orbit</li>
      <li><span class="dot" style="color:#b6ff3d"></span>Scroll to zoom</li>
      <li><span class="dot" style="color:#fff03d"></span>Click a point to glide in</li>
    </ul>
    <button class="go" id="go">Start exploring</button>
    <p class="esc">Press Esc to pull back</p>
  </div>
</div>
<canvas id="map" aria-label="A wireframe map of eight different ideas around the question: who keeps glory?" role="img"></canvas>
<header>
  <div>
    <nav class="crumb" id="crumb" aria-label="Location"></nav>
  </div>
</header>
<div class="modes" role="radiogroup" aria-label="Arrange texts"><button role="radio" aria-checked="true" data-mode="orbit">Map</button><button role="radio" aria-checked="false" data-mode="clusters">Clusters</button><button role="radio" aria-checked="false" data-mode="spectrum">Spectrum</button></div>
<aside id="panel" aria-live="polite">
  <button class="close" id="close" aria-label="Pull back">×</button>
  <div id="panelBody"></div>
</aside>
<script>
{
const Q='Quotes goes here',T='Text goes here';
/* cluster = shared idea of glory; rank = from the most public witness (0) to the most inward (7) */
const TEXTS=[
 {id:'pericles',name:'Pericles',work:'Thucydides, Funeral Oration',witness:'the city',hue:'#ff3df0',n:2,cluster:'city',rank:2},
 {id:'antigone',name:'Antigone',work:'Sophocles, Antigone',witness:'the gods and the family',hue:'#3dfcff',n:3,cluster:'higher',rank:4},
 {id:'socrates',name:'Socrates',work:'Plato, Apology',witness:'the soul and the god',hue:'#b6ff3d',n:3,cluster:'higher',rank:5},
 {id:'aristotle',name:'Aristotle',work:'Politics I & III',witness:'the political community',hue:'#ff6b3d',n:2,cluster:'city',rank:3},
 {id:'augustine',name:'Augustine',work:'City of God',witness:'God, witness of conscience',hue:'#8b6bff',n:2,cluster:'higher',rank:6},
 {id:'kalila',name:'Kalila and Dimna',work:'Ibn al-Muqaffa',witness:'the king and the court',hue:'#3dff9e',n:2,cluster:'appearance',rank:1},
 {id:'machiavelli',name:'Machiavelli',work:'The Prince',witness:'the people’s eyes',hue:'#ff3d7f',n:2,cluster:'appearance',rank:0},
 {id:'arendt',name:'Arendt',work:'“The Concept of History”',witness:'the storyteller',hue:'#fff03d',n:4,cluster:'story',rank:7}
];
const CLUSTERS=[
 {id:'city',label:'Glory from the city',a:-1.4},
 {id:'appearance',label:'Glory as appearance',a:0.2},
 {id:'higher',label:'Glory from a higher witness',a:1.95},
 {id:'story',label:'Glory as the telling',a:3.55}
];
/* ---------- points resting on the sheet ---------- */
const nodes=[];
const root={id:'root',label:'Glory',x:0,z:0,r:9,mass:110,kind:'root',hue:'#ffffff',seed:0,lay:{}};nodes.push(root);
TEXTS.forEach((t,i)=>{
  const a=i/TEXTS.length*Math.PI*2+0.2, R=430+(i%2)*90;
  const n={id:t.id,label:t.name,data:t,hue:t.hue,kind:'text',r:7,mass:70,x:Math.cos(a)*R,z:Math.sin(a)*R,parent:root,seed:i*2.3+1,lay:{}};
  n.lay.orbit=[n.x,n.z];
  nodes.push(n);
  for(let j=0;j<t.n;j++){
    const b=a+Math.PI+(j/t.n)*Math.PI*2+0.5, rr=120+(j%2)*30;
    nodes.push({id:t.id+'-'+(j+1),label:Q,idx:j+1,data:t,hue:t.hue,kind:'passage',r:3.6,mass:22,parent:n,seed:i*5+j,
      ox:Math.cos(b)*rr,oz:Math.sin(b)*rr,x:n.x+Math.cos(b)*rr,z:n.z+Math.sin(b)*rr});
  }
});
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
const texts=nodes.filter(n=>n.kind==='text');
/* cluster layout: each idea is a shared well, its texts circle the bottom of it */
CLUSTERS.forEach(c=>{
  c.x=Math.cos(c.a)*430;c.z=Math.sin(c.a)*430;c.lx=Math.cos(c.a)*660;c.lz=Math.sin(c.a)*660;
  const m=texts.filter(n=>n.data.cluster===c.id);
  m.forEach((n,k)=>{const b=c.a+Math.PI+k/m.length*Math.PI*2,r=m.length>1?130:0;n.lay.clusters=[c.x+Math.cos(b)*r,c.z+Math.sin(b)*r]});
});
/* spectrum layout: a line across the sheet, public on the left, inward on the right */
texts.forEach(n=>{const r=n.data.rank;n.lay.spectrum=[-840+r*240,(r%2?110:-110)]});
root.lay={orbit:[0,0],clusters:[0,0],spectrum:[0,-520]};
const SCALE={orbit:1,clusters:.6,spectrum:.62};
const ENDS=[{label:'Seen by many',x:-840,z:330},{label:'Seen by one',x:840,z:330}];
let mode='orbit',labelFade={orbit:1,clusters:0,spectrum:0};

/* ---------- the mesh ---------- */
const SPAN=1300,STEP=50,N=Math.round(SPAN*2/STEP)+1;
const grid=new Float32Array(N*N*3);

/* ---------- camera: two-stage easing, soft start and soft stop ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cam={fx:0,fz:0,dist:4200,yaw:-0.6,pitch:1.42};
const tgt={...cam},mid={...cam};
const EASE=reduce?1:0.032;
let focus=root;

const cv=document.getElementById('map'),ctx=cv.getContext('2d');
const panel=document.getElementById('panel'),body=document.getElementById('panelBody'),crumb=document.getElementById('crumb');
let W=0,H=0,DPR=1;
const resize=()=>{DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)};
addEventListener('resize',resize);resize();

const mouse={x:-9999,y:-9999,in:false};
const well={x:-9999,y:-9999,k:0};               // the visitor's own gravity, eased
let offX=0,offY=0;
function proj(x,y,z){
  x-=cam.fx;z-=cam.fz;
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);[x,z]=[x*cy-z*sy,x*sy+z*cy];
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);[y,z]=[y*cp-z*sp,y*sp+z*cp];
  z+=cam.dist;
  const s=Math.min(W,H)*1.1/Math.max(z,30);
  return [W/2+offX+x*s,H/2+offY+y*s,z,s];
}
/* depth of the sheet at a world point: masses of the texts + the cursor's well */
function sink(x,z,sx,sy){
  let d=0;
  for(const n of nodes){const dx=x-n.x,dz=z-n.z;d+=n.mass*Math.exp(-(dx*dx+dz*dz)/(2*(n.kind==='passage'?40:n.kind==='root'?120:80)**2))}
  const cf=labelFade.clusters;if(cf>0.01)for(const c of CLUSTERS){const dx=x-c.x,dz=z-c.z;d+=cf*95*Math.exp(-(dx*dx+dz*dz)/(2*230*230))}
  if(well.k>0.001){const dx=sx-well.x,dy=sy-well.y,r2=dx*dx+dy*dy;d+=well.k*170/(1+r2/(90*90))}
  return d;
}
const rgba=(hex,a)=>{const v=parseInt(hex.slice(1),16);return `rgba(${v>>16},${v>>8&255},${v&255},${a})`};
let hover=null;const P=new Map();

function frame(t){
  for(const k in mid){mid[k]+=(tgt[k]-mid[k])*EASE;cam[k]+=(mid[k]-cam[k])*EASE}
  const mv=reduce?1:0.035;
  for(const k in labelFade)labelFade[k]+=((k===mode?1:0)-labelFade[k])*(reduce?1:0.04);
  for(const n of nodes){
    if(n.kind==='passage'){const sc=SCALE[mode];n.tx=n.parent.x+n.ox*sc;n.tz=n.parent.z+n.oz*sc}
    else{n.tx=n.lay[mode][0];n.tz=n.lay[mode][1]}
    n.x+=(n.tx-n.x)*mv;n.z+=(n.tz-n.z)*mv;
  }
  if(focus!==root){tgt.fx=focus.x;tgt.fz=focus.z}
  const open=panel.classList.contains('open');
  offX+=((open&&W>600?-Math.min(210,W*.2):0)-offX)*0.05;
  offY+=((open&&W<=600?-H*.2:0)-offY)*0.05;
  // the well follows the cursor like something heavy and wet
  const fol=reduce?1:0.12;
  if(well.x<-9000){well.x=mouse.x;well.y=mouse.y}
  well.x+=(mouse.x-well.x)*fol;well.y+=(mouse.y-well.y)*fol;
  well.k+=((mouse.in?1:0)-well.k)*0.06;

  ctx.fillStyle='#07070b';ctx.fillRect(0,0,W,H);
  // project mesh: flat first (to know where it sits on screen), then sunk
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const x=-SPAN+i*STEP,z=-SPAN+j*STEP;
    const f=proj(x,0,z);
    const ripple=reduce?0:Math.sin(t*0.0012+(x+z)*0.004)*3;
    const q=proj(x,sink(x,z,f[0],f[1])+ripple,z);
    const o=(i*N+j)*3;grid[o]=q[0];grid[o+1]=q[1];grid[o+2]=q[2];
  }
  ctx.lineWidth=1;
  const fade=(i,j)=>{const x=-SPAN+i*STEP,z=-SPAN+j*STEP;const e=1-Math.max(Math.abs(x),Math.abs(z))/SPAN;return Math.max(0,Math.min(1,e*2.2))};
  for(let pass=0;pass<2;pass++){
    for(let a=0;a<N;a++){
      ctx.beginPath();
      let pen=false;
      for(let b=0;b<N;b++){
        const i=pass?b:a,j=pass?a:b,o=(i*N+j)*3;
        if(grid[o+2]<40){pen=false;continue}
        pen?ctx.lineTo(grid[o],grid[o+1]):ctx.moveTo(grid[o],grid[o+1]);pen=true;
      }
      ctx.strokeStyle=`rgba(170,185,255,${0.05+0.16*fade(pass?N>>1:a,pass?a:N>>1)})`;
      ctx.stroke();
    }
  }
  // idea labels resting on the sheet
  const sheetLabel=(txt,x,z,a,size)=>{if(a<0.02)return;const f=proj(x,0,z);const q=proj(x,sink(x,z,f[0],f[1]),z);if(q[2]<30)return;
    ctx.globalAlpha=a*.85;ctx.fillStyle='#c9cee6';ctx.font=`400 ${Math.round(Math.max(12,size*q[3]))}px Inter,sans-serif`;ctx.textAlign='center';ctx.fillText(txt,q[0],q[1])};
  for(const c of CLUSTERS)sheetLabel(c.label,c.lx,c.lz,labelFade.clusters,26);
  for(const e of ENDS)sheetLabel(e.label,e.x,e.z,labelFade.spectrum,24);
  if(labelFade.spectrum>0.02){ctx.globalAlpha=labelFade.spectrum*.5;ctx.strokeStyle='#c9cee6';ctx.setLineDash([4,6]);ctx.beginPath();
    for(let k=0;k<=60;k++){const x=-900+k*30,f=proj(x,0,250),q=proj(x,sink(x,250,f[0],f[1]),250);k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}
    ctx.stroke();ctx.setLineDash([])}
  ctx.globalAlpha=1;
  // neon points, resting in their own dents
  P.clear();
  for(const n of nodes){const f=proj(n.x,0,n.z);const bob=reduce?0:Math.sin(t*0.0015+n.seed)*4;P.set(n,proj(n.x,sink(n.x,n.z,f[0],f[1])-14-bob,n.z))}
  const order=[...nodes].sort((a,b)=>P.get(b)[2]-P.get(a)[2]);
  const lit=n=>focus===root?n.kind!=='passage':n===focus||n.parent===focus||n===focus.parent||n.parent===focus.parent;
  ctx.textAlign='center';
  for(const n of order){
    const [x,y,z,s]=P.get(n);if(z<30)continue;
    const on=lit(n),h=n===hover||n===focus;
    const r=Math.max(1.6,n.r*s*(h?1.5:1)*1.4);
    ctx.globalAlpha=on?1:.32;
    ctx.shadowColor=n.hue;ctx.shadowBlur=(h?34:18)*Math.min(1.4,s*1.2);
    ctx.fillStyle=n.hue;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#ffffff';ctx.globalAlpha*=.85;ctx.beginPath();ctx.arc(x,y,r*.42,0,7);ctx.fill();
    if(h){ctx.strokeStyle=rgba(n.hue,.6);ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,r+8+Math.sin(t*.004)*2,0,7);ctx.stroke()}
    const showLabel=n.kind!=='passage'||(on&&focus!==root)||n===hover;
    if(showLabel&&s>.3){
      ctx.globalAlpha=on?1:.4;
      if(n.kind==='root'){ctx.fillStyle='#eceef6';ctx.font=`400 ${Math.round(Math.max(18,30*s))}px "Instrument Serif",serif`;ctx.fillText(n.label,x,y-r-18)}
      else if(n.kind==='text'){ctx.fillStyle=n.hue;ctx.font=`400 ${Math.round(Math.max(15,26*s))}px "Instrument Serif",serif`;ctx.fillText(n.label,x,y-r-14)}
      else{ctx.fillStyle='#eceef6';ctx.font=`italic 400 ${Math.round(Math.max(13,18*s))}px "Instrument Serif",serif`;ctx.fillText(n.label,x,y-r-10)}
    }
  }
  ctx.globalAlpha=1;
  // a small ring for the cursor itself
  if(mouse.in&&matchMedia('(hover:hover)').matches){ctx.strokeStyle='rgba(236,238,246,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(mouse.x,mouse.y,hover?11:6,0,7);ctx.stroke()}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- focus: glide down into a point ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function goTo(n,push=true){
  focus=n;tgt.fx=n===root?0:(n.tx??n.x);tgt.fz=n===root?0:(n.tz??n.z);
  tgt.dist=n.kind==='root'?(mode==='orbit'?1500:1650):n.kind==='text'?620:330;
  tgt.pitch=n.kind==='root'?(mode==='spectrum'?0.7:0.62):n.kind==='text'?0.78:0.9;
  if(n.kind!=='root'&&mode==='spectrum')tgt.yaw=0;
  else if(n.kind!=='root'){const px=n.tx??n.x,pz=n.tz??n.z;let y=-Math.atan2(pz,px)+Math.PI/2;while(y-tgt.yaw>Math.PI)y-=Math.PI*2;while(y-tgt.yaw<-Math.PI)y+=Math.PI*2;tgt.yaw=y}
  renderPanel(n);renderCrumb(n);
  if(push){const h=n===root?'':'#'+n.id;if(location.hash!==h)history.replaceState(null,'',h||location.pathname)}
}
function renderCrumb(n){
  const trail=[];let p=n;while(p){trail.unshift(p);p=p.parent}
  const nm=p=>p.kind==='root'?'Map':p.kind==='passage'?'Quote '+p.idx:p.label;
  crumb.innerHTML=trail.length<2?'':trail.map((p,i)=>i===trail.length-1?`<span class="here">${esc(nm(p))}</span>`:`<button data-go="${p.id}">${esc(nm(p))}</button><span aria-hidden="true">/</span>`).join('');
}
function renderPanel(n){
  document.body.classList.toggle('reading',n.kind!=='root');
  if(n.kind==='root'){panel.classList.remove('open');return}
  const t=n.data;panel.style.setProperty('--hue',t.hue);
  const list=Array.from({length:t.n},(_,j)=>`<li><button data-go="${t.id}-${j+1}"><span class="q">${Q}</span></button></li>`).join('');
  body.innerHTML=n.kind==='text'
   ?`<h2>${esc(t.name)}</h2><p class="who">${esc(t.work)} · witness: <b>${esc(t.witness)}</b></p><ol>${list}</ol><p class="note">${T}</p><button class="enter" data-go="${t.id}-1">Walk the branch →</button>`
   :`<h2>${Q}</h2><p class="who">${esc(t.name)} · quote ${n.idx}</p><p class="note">${T}</p><ol>${list}</ol><button class="enter" data-go="${t.id}">← Back to ${esc(t.name)}</button>`;
  panel.classList.add('open');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){e.stopPropagation();goTo(byId[b.dataset.go])}});
document.getElementById('close').onclick=()=>goTo(focus.parent||root);

/* ---------- pointer ---------- */
let drag=null,moved=0;
function pick(x,y){let best=null,bd=1e9;for(const n of nodes){const q=P.get(n);if(!q||q[2]<30)continue;const r=Math.max(16,n.r*q[3]*2+10),d=Math.hypot(q[0]-x,q[1]-y);if(d<r&&q[2]<bd){best=n;bd=q[2]}}return best}
cv.addEventListener('pointermove',e=>{
  mouse.x=e.clientX;mouse.y=e.clientY;mouse.in=true;
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);tgt.yaw+=dx*0.004;tgt.pitch=Math.max(0.2,Math.min(1.35,tgt.pitch+dy*0.003));drag={x:e.clientX,y:e.clientY}}
  hover=pick(e.clientX,e.clientY);
});
cv.addEventListener('pointerdown',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.in=true;drag={x:e.clientX,y:e.clientY};moved=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',e=>{drag=null;if(moved<6){const n=pick(e.clientX,e.clientY);if(n)goTo(n===focus&&n.parent?n.parent:n);else if(focus!==root)goTo(focus.parent||root)}if(e.pointerType!=='mouse')mouse.in=false});
cv.addEventListener('pointerleave',()=>{hover=null;mouse.in=false});
cv.addEventListener('wheel',e=>{e.preventDefault();tgt.dist=Math.max(200,Math.min(2600,tgt.dist*(1+e.deltaY*0.0007)))},{passive:false});
addEventListener('keydown',e=>{
  if(!started)return;
  if(e.key==='Escape')goTo(focus.parent||root);
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    const sibs=focus===root?nodes.filter(n=>n.kind==='text'):nodes.filter(n=>n.parent===focus.parent);
    const i=sibs.indexOf(focus),d=e.key==='ArrowRight'?1:-1;goTo(sibs[(i+d+sibs.length)%sibs.length]);
  }
});
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.mode;document.querySelectorAll('.modes button').forEach(x=>x.setAttribute('aria-checked',x===b));
  if(focus!==root)goTo(root);
  tgt.yaw=mode==='spectrum'?0:0.4;tgt.pitch=mode==='spectrum'?0.7:0.62;tgt.dist=mode==='orbit'?1500:1650;
}));
const fromHash=()=>{goTo(byId[location.hash.slice(1)]||root,false)};
addEventListener('hashchange',()=>{if(started)fromHash()});
let started=false;
/* before starting: hover far above the sheet, turning slowly */
(function idle(){if(started)return;tgt.yaw+=reduce?0:0.0015;requestAnimationFrame(idle)})();
function start(){
  if(started)return;started=true;
  document.getElementById('intro').classList.add('gone');document.body.classList.remove('intro');
  tgt.yaw=0.4;fromHash();
}
document.getElementById('go').addEventListener('click',start);
addEventListener('keydown',e=>{if(!started&&e.key==='Enter')start()});
document.getElementById('go').focus();
}
</script>
</body>
</html>
